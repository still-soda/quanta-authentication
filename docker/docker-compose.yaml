name: quanta-authentication

services:
  qauth-server:
    container_name: quanta-authentication
    restart: unless-stopped
    networks:
      - quanta-auth-network
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/authentication_db
      - SECRET_KEY=your_secret_key_here
      - FLASK_ENV=production
    depends_on:
      - postgres
      - redis

  qauth-admin-web:
    container_name: quanta-auth-admin-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - API_URL=http://qauth-server:5000

  postgres:
    image: postgres:16
    container_name: quanta-auth-db
    networks:
      - quanta-auth-network
    restart: unless-stopped
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=authentication_db
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:6
    container_name: quanta-auth-redis
    networks:
      - quanta-auth-network
    restart: unless-stopped
    ports:
      - "6379:6379"

networks:
  quanta-auth-network:
    driver: bridge

volumes:
  db_data:

name: qauth

services:
  server:
    container_name: qauth-server
    build:
      context: ../packages/qauth-server/
      dockerfile: ../../docker/server.Dockerfile
      args:
        - PORT=8080
    networks:
      - qauth-network
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@database:5432/${POSTGRES_DB:-qauth}?sslmode=disable
      - SECRET_KEY=${SECRET_KEY:-your_secret_key_here}
      - REDIS_ADDR=cache:6379
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy

  admin-web:
    container_name: qauth-admin-web
    build:
      context: ../packages/qauth-admin-web/
      dockerfile: ../../docker/admin-web.Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    restart: unless-stopped
    networks:
      - qauth-network

  database:
    image: postgres:16
    container_name: qauth-database
    networks:
      - qauth-network
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-qauth}
    ports:
      - "15432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-qauth}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cache:
    image: redis:6
    container_name: qauth-cache
    networks:
      - qauth-network
    restart: unless-stopped
    ports:
      - "16379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  gateway:
    image: nginx:latest
    container_name: qauth-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ../nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - server
      - admin-web
    networks:
      - qauth-network

networks:
  qauth-network:
    driver: bridge

volumes:
  db_data:

name: quanta-authentication

services:
  qauth-server:
    container_name: quanta-auth-server
    build:
      context: ../packages/
      dockerfile: ../docker/Dockerfile.Server
      args:
        - PORT=8080
    networks:
      - quanta-auth-network
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/authentication_db
      - SECRET_KEY=your_secret_key_here
      - FLASK_ENV=production
    depends_on:
      - postgres
      - redis

  qauth-admin-web:
    container_name: quanta-auth-admin-web
    build:
      context: ../packages/
      dockerfile: ../docker/Dockerfile.AdminWeb
    restart: unless-stopped
    environment:
      - API_URL=http://qauth-server:8080

  postgres:
    image: postgres:16
    container_name: quanta-auth-db
    networks:
      - quanta-auth-network
    restart: unless-stopped
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=authentication_db
    ports:
      - "15432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:6
    container_name: quanta-auth-redis
    networks:
      - quanta-auth-network
    restart: unless-stopped
    ports:
      - "16379:6379"

  # Nginx 网关
  gateway:
    image: nginx:latest
    container_name: quanta-auth-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - qauth-server
      - qauth-admin-web
    networks:
      - quanta-auth-network

networks:
  quanta-auth-network:
    driver: bridge

volumes:
  db_data:

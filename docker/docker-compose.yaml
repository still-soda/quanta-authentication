name: qauth

services:
  server:
    container_name: qauth-server
    build:
      context: ../packages/qauth-server/
      dockerfile: ../../docker/Dockerfile.Server
      args:
        - PORT=8080
    networks:
      - qauth-network
    environment:
      - DATABASE_URL=postgresql://user:password@database:5432/qauth?sslmode=disable
      - SECRET_KEY=your_secret_key_here
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started

  admin-web:
    container_name: qauth-admin-web
    build:
      context: ../packages/qauth-admin-web/
      dockerfile: ../../docker/Dockerfile.AdminWeb
    restart: unless-stopped
    environment:
      - API_URL=http://server:8080
    networks:
      - qauth-network

  database:
    image: postgres:16
    container_name: qauth-db
    networks:
      - qauth-network
    restart: unless-stopped
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=qauth
    ports:
      - "15432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d qauth" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cache:
    image: redis:6
    container_name: qauth-redis
    networks:
      - qauth-network
    restart: unless-stopped
    ports:
      - "16379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Nginx 网关
  gateway:
    image: nginx:latest
    container_name: qauth-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ../nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - server
      - admin-web
    networks:
      - qauth-network

networks:
  qauth-network:
    driver: bridge

volumes:
  db_data:
